# Health-check TNMath.
# Lịch cron dùng UTC (Việt Nam = UTC+7):
#   0 1 * * *  → 08:00 ICT
#   0 9 * * *  → 16:00 ICT
# Chạy trên runner self-hosted ở Việt Nam. Máy ubuntu-latest của GitHub ở nước ngoài,
# đường đi tới prod làm t_login vượt 6s dù site vẫn đăng nhập được.
# Secrets (Settings → Secrets and variables → Actions), không commit .env:
#   STUDENT_USER, STUDENT_PASS, DISCORD_WEBHOOK_URL

name: Health check

on:
  schedule:
    - cron: '0 1 * * *'
    - cron: '0 9 * * *'
  workflow_dispatch:

concurrency:
  group: health-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: self-hosted
    timeout-minutes: 60
    # Dịch vụ Windows chạy bằng NETWORK SERVICE, ExecutionPolicy chặn npm.ps1.
    # cmd gọi npm.cmd nên không vướng policy đó.
    defaults:
      run:
        shell: cmd
    env:
      STUDENT_USER: ${{ secrets.STUDENT_USER }}
      STUDENT_PASS: ${{ secrets.STUDENT_PASS }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install chromium

      # .env.example có URL và content ID. dotenv không ghi đè biến đã có,
      # nên 3 secret ở trên vẫn thắng các dòng trống trong file mẫu.
      - name: Prepare env file
        run: node -e "require('fs').copyFileSync('.env.example','.env')"

      - name: Run health check
        run: npm test

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
